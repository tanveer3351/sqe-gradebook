
sonar.projectKey=tanveer3351_sqe-gradebook
sonar.organization=tanveer3351

sonar.projectName=sqe-gradebook
sonar.sourceEncoding=UTF-8

# Application source code
sonar.sources=src

# Automated test source code
sonar.tests=tests

# Compiled Java classes
sonar.java.binaries=out
sonar.java.test.binaries=out
sonar.java.test.libraries=lib/junit-platform-console-standalone-1.10.2.jar,lib/mockito-core-5.18.0.jar,lib/byte-buddy-1.15.11.jar,lib/byte-buddy-agent-1.15.11.jar,lib/objenesis-3.3.jar

# JaCoCo XML coverage report
sonar.coverage.jacoco.xmlReportPaths=coverage-report-app/jacoco.xml

# Exclude generated reports from analysis
sonar.exclusions=coverage-report/**,coverage-report-app/**
