name: Java Tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Create output directory
        run: mkdir -p out

      - name: Compile source files
        run: |
          javac -cp "lib/junit-platform-console-standalone-1.10.2.jar:out" \
            -d out src/gradebook/*.java

      - name: Compile test files
        run: |
          javac -cp "lib/junit-platform-console-standalone-1.10.2.jar:lib/mockito-core-5.18.0.jar:lib/byte-buddy-1.15.11.jar:lib/byte-buddy-agent-1.15.11.jar:lib/objenesis-3.3.jar:out" \
            -d out tests/*.java

      - name: Run JUnit tests
        run: |
          java -jar lib/junit-platform-console-standalone-1.10.2.jar \
            execute \
            --class-path "out:lib/mockito-core-5.18.0.jar:lib/byte-buddy-1.15.11.jar:lib/byte-buddy-agent-1.15.11.jar:lib/objenesis-3.3.jar" \
            --scan-class-path
